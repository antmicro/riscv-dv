name: run-tests

on:
  push:
  # TODO :: Here
  # pull_request:

jobs:
  build-spike:
    uses: ./.github/workflows/build-spike.yml

  build-verilator:
    uses: ./.github/workflows/build-verilator.yml

  generate-config:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.test-types.outputs.targets }}
      tests: ${{ steps.test-types.outputs.tests }}
      hash: ${{ steps.hash.outputs.files-hash }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: test-types
        name: Prepare test types
        run: |
          python3 -m pip install pyyaml --break-system-packages
          targets_json='["rv32i", "multi_harts", "rv32imc" ]'
          echo "targets=$targets_json" | tee -a $GITHUB_OUTPUT
          python3 .github/scripts/parse_testlist.py --simulator verilator $(echo $targets_json | jq -r '.[]') > verilator_tests.list
          python3 .github/scripts/parse_testlist.py --simulator pyflow --test riscv_arithmetic_basic_test rv32imc > pyflow_tests.list
          echo "tests=$(jq -c -s add verilator_tests.list pyflow_tests.list)" | tee -a $GITHUB_OUTPUT
      - id: hash
        name: Prepare files' hash
        run: |
          shopt -s globstar nullglob
          sha256sum **/*.sv **/*.svh files.f **/*.py **/*.yaml > file.hash
          echo "files-hash=$(cat file.hash | cut -d\  -f1 | sha256sum | cut -d\  -f1)" | tee -a $GITHUB_OUTPUT

  build-generator:
    runs-on: ubuntu-latest
    needs: [ generate-config, build-verilator ]
    env:
      UVM_VERSION: 578a46777ef0e0c9fa80e26d60ea4d100bb3cc84
    strategy:
        fail-fast: false
        matrix:
          target: ${{ fromJSON(needs.generate-config.outputs.targets) }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Cache Metadata
        id: cache_metadata
        run: |
          cache_generator_key=cache_${{ matrix.target }}_${{ needs.build-verilator.outputs.cache_key }}_uvm_${{ env.UVM_VERSION }}
          files_hash=${{ needs.generate-config.outputs.hash }}
          echo "cache_generator=${cache_generator_key}_${files_hash}" | tee -a "$GITHUB_ENV"

      - name: Cache Code
        uses: actions/cache@v6.1.0
        id: cache-generator
        timeout-minutes: 60
        with:
          path: out/Vuvm
          key: ${{ env.cache_generator }}

      - name: Setup Environment
        if: steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache build-essential mold z3
          echo "NPROC=$(nproc)" >> $GITHUB_ENV
          echo "UVM_HOME=/opt/uvm-verilator" >> $GITHUB_ENV
          echo "VERILATOR_PATH=${{ needs.build-verilator.outputs.install_prefix }}" >> $GITHUB_ENV

      - name: Checkout UVM Verilator
        if: steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          git init uvm-verilator
          git -C uvm-verilator fetch --depth 1 https://github.com/antmicro/uvm-verilator "$UVM_VERSION"
          git -C uvm-verilator checkout FETCH_HEAD

      - name: Move UVM Verilator
        if: steps.cache-generator.outputs.cache-hit != 'true'
        run: mv uvm-verilator /opt/uvm-verilator

      - name: Setup python
        if: steps.cache-generator.outputs.cache-hit != 'true'
        uses: actions/setup-python@v4
        with:
          # python dependencies cannot be properly downloaded with new versions of python
          python-version: '3.9'
          cache: 'pip'
      - if: steps.cache-generator.outputs.cache-hit != 'true'
        run: python3 -m pip install -r requirements.txt

      - name: Restore verilator cache
        if: steps.cache-generator.outputs.cache-hit != 'true'
        id: cache-verilator-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ needs.build-verilator.outputs.install_prefix }}
          key: ${{ needs.build-verilator.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Build Generator
        if: steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          python3 run.py --simulator verilator --co \
            --target ${{ matrix.target }} \
            -v -o out 2>&1 | tee test/build_generator.log
          $VERILATOR_PATH/bin/verilator --version

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator_${{ matrix.target }}
          path: |
            out/Vuvm
            test/build_generator.log

  run-tests:
    runs-on: ubuntu-latest
    needs: [ build-spike, build-generator, generate-config ]
    if: ${{ !cancelled() && needs.build-spike.result == 'success' && needs.generate-config.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-config.outputs.tests) }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: sudo apt-get -qqy update && sudo apt-get -qqy install device-tree-compiler z3

      - name: Install cross-compiler
        shell: bash
        run: |
          echo "deb http://archive.ubuntu.com/ubuntu/ noble main universe" | sudo tee -a /etc/apt/sources.list > /dev/null
          sudo apt -qqy update && sudo apt -qqy --no-install-recommends install gcc-riscv64-unknown-elf
          riscv64-unknown-elf-gcc --version

      - name: Setup python
        # python dependencies cannot be properly downloaded with new versions of python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      - run: python3 -m pip install -r requirements.txt

      - name: Restore Spike cache
        id: cache-spike-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            /opt/spike
            /opt/spike/.cache
          key: ${{ needs.build-spike.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Set variables
        run: |
          echo "RISCV_GCC=riscv64-unknown-elf-gcc" >> $GITHUB_ENV
          echo "RISCV_OBJCOPY=riscv64-unknown-elf-objcopy" >> $GITHUB_ENV
          echo "SPIKE_PATH=/opt/spike/bin" >> $GITHUB_ENV
          echo "PYTHONPATH=pygen" >> $GITHUB_ENV

      - name: Download generator
        if: matrix.simulator == 'verilator'
        uses: actions/download-artifact@v4
        with:
          name: generator_${{ matrix.target }}

      - name: Fix environment
        if: matrix.simulator == 'verilator'
        run: |
          chmod +x out/Vuvm
          echo "UVM_HOME=unused" >> $GITHUB_ENV
          echo "VERILATOR_PATH=unused" >> $GITHUB_ENV
          echo "NPROC=unused" >> $GITHUB_ENV

      - name: Run Tests
        run: |
          set -eo pipefail
          python3 run.py \
            --target ${{ matrix.target }} --test ${{ matrix.test }} \
            --iss spike --iss_timeout 60 --gen_timeout 720 --start_seed 999 \
            --iterations 1 --batch_size 1 --noclean \
            --simulator ${{ matrix.simulator }} \
            --so -o out 2>&1 | tee -a test/generate.log

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run_tests_log_${{ matrix.target }}_${{ matrix.test }}_${{ matrix.simulator }}
          path: |
            test/*.log
            out/**/${{ matrix.test }}*.log
