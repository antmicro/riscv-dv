name: pyflow tests

on:
  push:
  pull_request:

jobs:
  build-spike:
    uses: ./.github/workflows/build-spike.yml

  generate-config:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.test-types.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: test-types
        name: Prepare test types
        run: |
          python3 -m venv .venv && source .venv/bin/activate
          python3 -m pip install pyyaml
          targets_json='["rv32i", "multi_harts", "rv32imc" ]'
          python3 .github/scripts/parse_testlist.py --simulator pyflow $(echo $targets_json | jq -r '.[]') > pyflow_tests.list
          echo "tests=$(cat pyflow_tests.list)" | tee -a $GITHUB_OUTPUT

  run-tests:
    runs-on: ubuntu-latest
    needs: [ build-spike, generate-config ]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-config.outputs.tests) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get -qqy update && sudo apt-get -qqy install device-tree-compiler

      - name: Install cross-compiler
        shell: bash
        run: |
          echo "deb http://archive.ubuntu.com/ubuntu/ noble main universe" | sudo tee -a /etc/apt/sources.list > /dev/null
          sudo apt -qqy update && sudo apt -qqy --no-install-recommends install gcc-riscv64-unknown-elf
          riscv64-unknown-elf-gcc --version

      - name: Setup python
        # python dependencies cannot be properly downloaded with new versions of python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      - run: python3 -m pip install -r requirements.txt

      - name: Restore Spike cache
        id: cache-spike-restore
        uses: actions/cache/restore@v3
        with:
          path: |
            /opt/spike
            /opt/spike/.cache
          key: ${{ needs.build-spike.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Set variables
        run: |
          echo "RISCV_GCC=riscv64-unknown-elf-gcc" >> $GITHUB_ENV
          echo "RISCV_OBJCOPY=riscv64-unknown-elf-objcopy" >> $GITHUB_ENV
          echo "SPIKE_PATH=/opt/spike/bin" >> $GITHUB_ENV
          echo "PYTHONPATH=pygen" >> $GITHUB_ENV

      - name: Run Tests
        run: |
          set -eo pipefail
          python3 run.py \
            --target ${{ matrix.target }} --test ${{ matrix.test }} \
            --iss spike --iss_timeout 60 --gen_timeout 720 --start_seed 999 \
            --iterations 1 --batch_size 1 --noclean \
            --simulator ${{ matrix.simulator }} \
            --so -o out 2>&1 | tee -a test/generate.log

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run_tests_log_${{ matrix.target }}_${{ matrix.test }}_${{ matrix.simulator }}
          path: |
            test/*.log
            out/**/${{ matrix.test }}*.log
