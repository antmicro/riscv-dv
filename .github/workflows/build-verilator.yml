name: Verilator Build

on:
  workflow_call:
    outputs:
      cache_key:
        description: 'Cache key used to retrieve tool'
        value: ${{ jobs.verilator.outputs.cache_key }}
      install_prefix:
        description: 'A directory where tool is installed'
        value: ${{ jobs.verilator.outputs.install_prefix }}

env:
  TOOL_VERSION: 084977f5df23cf27324dfc3dde540defc7f17ce9
  DEBIAN_FRONTEND: "noninteractive"
  INSTALL_PREFIX: /opt/verilator

jobs:
  verilator:
    name: Prepare Verilator
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.cache_metadata.outputs.cache_key }}
      install_prefix: ${{ env.INSTALL_PREFIX }}

    steps:
      - name: Setup Cache Metadata
        id: cache_metadata
        run: |
          cache_key=cache_verilator_${{ env.TOOL_VERSION }}
          echo "cache_key=$cache_key" >> $GITHUB_OUTPUT

      - name: Setup cache
        uses: actions/cache@v3
        id: cache
        with:
          path: |
            ${{ env.INSTALL_PREFIX }}
          key: ${{ steps.cache_metadata.outputs.cache_key }}

      - name: Install prerequisites
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt -qqy update && sudo apt -qqy --no-install-recommends install \
            git help2man libfl-dev mold build-essential autoconf bison ccache

      - name: Checkout Verilator
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          git clone https://github.com/antmicro/verilator --depth 1 --revision "$TOOL_VERSION" verilator

      - name: Build Verilator
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          set -eo pipefail
          pushd verilator
            autoconf
            ./configure --prefix=${{ env.INSTALL_PREFIX }}
            make -j$(nproc)
            make install
            ${{ env.INSTALL_PREFIX }}/bin/verilator --version
          popd
