name: Verilator Build

on:
  workflow_call:
    inputs:
      install_prefix:
        description: 'A directory where tool will be installed'
        default: /opt/verilator
        required: false
        type: string
    outputs:
      cache_key:
        description: 'Cache key used to retrieve tool'
        value: ${{ jobs.verilator.outputs.cache_key }}

env:
  TOOL_NAME: verilator
  TOOL_VERSION: 084977f5
  DEBIAN_FRONTEND: "noninteractive"

jobs:
  verilator:
    name: Prepare Verilator
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.cache_metadata.outputs.cache_key }}

    steps:
      - name: Setup Cache Metadata
        id: cache_metadata
        run: |
          cache_key=cache_${{ env.TOOL_NAME }}_${{ env.TOOL_VERSION }}
          echo "cache_key=$cache_key" >> $GITHUB_OUTPUT

      - name: Setup cache
        uses: actions/cache@v6.1.0
        id: cache
        timeout-minutes: 60
        with:
          path: |
            ${{ inputs.install_prefix }}
          key: ${{ steps.cache_metadata.outputs.cache_key }}

      - name: Install prerequisites
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          sudo apt -qqy update && sudo apt -qqy --no-install-recommends install \
            git ccache help2man libfl-dev libsystemc-dev mold build-essential \
            autoconf bison

      - name: Build Verilator
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          set -eo pipefail
          git clone https://github.com/antmicro/verilator.git -b riscv-dv-runtime-rebased
          pushd verilator
            git checkout ${{ env.TOOL_VERSION }}
            autoconf
            ./configure --prefix=${{ inputs.install_prefix }}
            make -j$(nproc)
            make install
            ${{ inputs.install_prefix }}/bin/verilator --version
          popd
